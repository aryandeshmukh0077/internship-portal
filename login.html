<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candidate login</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-page="login">
    <header class="topbar">
      <nav class="nav">
        <a class="brand" href="/candidate/index.html">Internship Connect</a>
        <div class="nav-links">
          <a href="/candidate/internships.html">Internships</a>
          <a href="/candidate/register.html">Register</a>
          <a href="/admin/admin-login.html">Admin</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="panel narrow">
        <h1>Candidate login</h1>
        <p class="muted">Sign in to manage your profile and applications.</p>

        <form data-action="login" data-role="candidate">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>

          <button type="submit">Log in</button>
          <p id="message" class="notice" role="status"></p>
        </form>

        <p class="hint">New here? <a href="register.html">Create an account</a>.</p>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
