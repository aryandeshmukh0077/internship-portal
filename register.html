<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create candidate account</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-page="register">
    <header class="topbar">
      <nav class="nav">
        <a class="brand" href="/candidate/index.html">Internship Connect</a>
        <div class="nav-links">
          <a href="/candidate/internships.html">Internships</a>
          <a href="/candidate/login.html">Candidate login</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="panel narrow">
        <h1>Create account</h1>
        <p class="muted">Start with your name and email. Add the rest of your profile after registration.</p>

        <form data-action="register" data-role="candidate">
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" name="name" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
          </div>

          <button type="submit">Register</button>
          <p id="message" class="notice" role="status"></p>
        </form>

        <p class="hint">Already registered? <a href="login.html">Log in</a>.</p>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
